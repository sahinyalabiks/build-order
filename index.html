<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Build Order</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Build Order">
<meta name="theme-color" content="#161d30">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--blue:#1f6dff;--red:#ff2b3f;--ink:#121829;--panel:#161d30;--panel2:#222b45;--gold:#ffc93c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0c0f18;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#phone{width:414px;height:868px;border-radius:54px;background:#05070c;padding:12px;box-shadow:0 0 0 2px #2b3350,0 30px 80px rgba(0,0,0,.6);flex:none;position:relative}
#phone:before{content:"";position:absolute;top:22px;left:50%;width:96px;height:24px;margin-left:-48px;background:#05070c;border-radius:14px;z-index:50}
#screen{width:100%;height:100%;border-radius:42px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#e6ebf2}
body.bare #stage{position:static;height:100%}
body.bare #phone{width:100%;max-width:560px;margin:0 auto;height:100%;border-radius:0;padding:0;box-shadow:none;transform:none!important}
body.bare #panel{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.bare #phone:before{display:none}
body.bare #screen{border-radius:0}
#view{flex:1;position:relative;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* top hud */
#top{position:absolute;left:10px;right:10px;top:44px;display:flex;gap:8px;align-items:stretch;pointer-events:none}
body.bare #top{top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px))}
body.bare #toasts{top:98px}
body.pwa #top{top:calc(10px + env(safe-area-inset-top,0px))}
body.pwa #toasts{top:calc(98px + env(safe-area-inset-top,0px))}
body.pwa #panel{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.card{background:rgba(255,255,255,.92);border-radius:14px;box-shadow:0 4px 14px rgba(30,45,80,.16);color:var(--ink)}
#foe{flex:1;padding:7px 10px 8px}
#foe .row{display:flex;align-items:center;gap:8px}
.nm{font-weight:900;font-size:12px;letter-spacing:.08em}
.hp{flex:1;height:10px;border-radius:6px;background:#d6dcea;overflow:hidden;position:relative}
.hp i{position:absolute;inset:0;border-radius:6px;transform-origin:left;transition:transform .15s}
.hpn{font-weight:800;font-size:11px;min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
#intel{margin-top:6px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#5a6682}
#intel .tag{font-size:9px;font-weight:900;letter-spacing:.1em;background:var(--ink);color:#fff;border-radius:5px;padding:2px 5px}
#intel .it{display:flex;align-items:center;gap:3px;color:#aab3c8}
#intel .it svg{width:16px;height:16px}
#intel .it b{color:var(--ink);font-size:12px}
#intel .it.on{color:var(--red)}
#intel .it.prog{color:#ff9f1a;animation:pulse .7s infinite alternate}
#intel .it.off{color:#c3cada}
#intel #iage{margin-left:auto;font-weight:700;font-size:10px;color:#7c88a3}
#intel.flash{animation:iflash .9s}
@keyframes iflash{0%{background:#ffe27a;box-shadow:0 0 0 6px #ffe27a}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
@keyframes pulse{to{opacity:.35}}
#clock{width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:19px;font-variant-numeric:tabular-nums}
#clock small{font-size:8px;letter-spacing:.14em;color:#7c88a3}
#clock.hot{color:var(--red)}
#toasts{position:absolute;left:0;right:0;top:132px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-weight:800;font-size:12px;padding:7px 12px;border-radius:999px;animation:toast 2.4s forwards;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.toast.warn{background:var(--red)}.toast.good{background:var(--blue)}.toast.gold{background:#ffb800;color:#1a1400}
@keyframes toast{0%{transform:translateY(-8px) scale(.9);opacity:0}8%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}

/* bottom panel */
#panel{background:var(--panel);padding:9px 10px 16px;flex:none}
#me{display:flex;align-items:center;gap:8px;margin-bottom:7px}
#eco{display:flex;gap:6px;margin-bottom:7px}
#me .nm{color:#8fb6ff}
#me .hp{background:#2a3452}
#purse{display:flex;align-items:baseline;gap:5px;background:#0d1322;border-radius:10px;padding:4px 9px;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;min-width:104px;justify-content:flex-end}
#purse small{font-size:10px;color:#7fe08a;font-weight:800}
.coin{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 .12em #d99a00;vertical-align:-.04em;margin-right:.2em}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.col{display:flex;flex-direction:column;gap:5px}
button{font:inherit;color:inherit;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
.tr,.mn{position:relative;overflow:hidden;border-radius:11px;background:var(--panel2);transition:transform .06s,filter .15s}
.tr:active,.mn:active{transform:scale(.94)}
.tr{height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:9px;letter-spacing:.08em;line-height:1.25}
.tr .cost{font-size:12px;letter-spacing:0}
.tr.off{opacity:.3;pointer-events:none}
.poor .cost{color:#ff7d89}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(92,150,255,.45);pointer-events:none}
.tr>*:not(.fill),.mn>*:not(.fill){position:relative}
.qn{position:absolute!important;right:4px;top:2px;font-size:10px;color:#9cc0ff}
.mn{height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-bottom:4px solid rgba(0,0,0,.28)}
.mn svg{width:34px;height:34px}
.mn .cnt{position:absolute!important;top:5px;right:7px;font-weight:900;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.mn .sub{font-size:9px;font-weight:900;letter-spacing:.08em}
.mn .cost{font-size:12px;font-weight:900}
.mn .bt{font-size:8px;font-weight:800;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:2px;letter-spacing:.04em}
.mn .bt svg{width:11px;height:11px}
.mn.ready{background:var(--blue)}
.mn.ready.empty{background:#27407a}.mn.ready.empty svg,.mn.ready.empty .sub{opacity:.45}
.mn.locked{background:#1b2238;outline:1.5px dashed #3a4770;outline-offset:-3px}
.mn.locked svg{opacity:.5}
.mn.busy{background:#2a3555}
.mn.busy .sub{font-size:7.5px;letter-spacing:.02em}
.mn.busy .fill{background:rgba(255,184,0,.4)}
.mn.eco{background:#2d3a22}.mn.eco svg{color:var(--gold)}
.mn.half{height:72px;gap:1px;border-bottom-width:3px}.mn.half svg{width:24px;height:24px}.mn.half .cnt{font-size:16px;top:4px;right:6px}
.mn.sct{background:#3a2f12}.mn.sct svg{color:var(--gold)}
.mn.eco .fill{background:rgba(126,224,129,.35)}.mn.eco .qn{left:5px;right:auto;color:#9be8a0}
.float{position:absolute;transform:translate(-50%,-50%);background:var(--blue);color:#fff;font-weight:900;font-size:13px;padding:7px 13px 7px 9px;border-radius:999px;display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:none;box-shadow:0 0 0 3px #fff,0 8px 18px rgba(20,60,160,.45);animation:flt 2.6s forwards}
.float svg{width:18px;height:18px}
@keyframes flt{0%{opacity:0;margin-top:14px;scale:.6}10%{opacity:1;margin-top:0;scale:1.12}18%{scale:1}80%{opacity:1;margin-top:-22px}100%{opacity:0;margin-top:-34px}}
#eco #purse{flex:1;height:42px;align-items:center;justify-content:center;font-size:21px;gap:7px}
#eco #purse small{font-size:11px}
#wk{flex:1.35;height:42px;flex-direction:row;gap:7px;background:#2d3a22;border-bottom-width:3px}
#wk svg{width:22px;height:22px;color:var(--gold)}
#wk .wl{font-size:9.500px;font-weight:900;letter-spacing:.07em;display:flex;align-items:baseline;gap:4px}
#wk .wl b{font-size:18px;letter-spacing:0}
#wk .cost{font-size:13px;background:rgba(0,0,0,.3);border-radius:7px;padding:2px 7px}
#wk .fill{background:rgba(126,224,129,.35)}#wk .qn{right:5px;top:1px;color:#9be8a0}
.no{animation:no .25s}
@keyframes no{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* overlays */
#ov{position:absolute;inset:0;background:rgba(12,16,28,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 22px;z-index:20;text-align:center;overflow:auto}
#ov.hide{display:none}
#ov h1{margin:0;font-size:40px;font-weight:1000;letter-spacing:.02em;line-height:1}
#ov h1 span{color:var(--blue)}#ov h1.lose{color:var(--red)}#ov h1.win{color:#6aa5ff}
#ov p{color:#b9c3dc;font-size:13px;line-height:1.5;margin:10px 0}
#ov ul{list-style:none;padding:0;margin:12px 0 4px;text-align:left;font-size:12.5px;line-height:1.45;color:#d5dcee}
#ov li{margin:7px 0;padding-left:26px;position:relative}
#ov li svg{position:absolute;left:0;top:1px;width:18px;height:18px;color:var(--gold)}
#ov .rps{display:flex;gap:6px;justify-content:center;align-items:center;font-size:11px;font-weight:800;color:#9fb0d6;margin:8px 0}
#ov .rps svg{width:22px;height:22px;color:#fff}
.go{margin-top:16px;background:var(--blue);padding:15px 44px;border-radius:16px;font-weight:1000;font-size:18px;letter-spacing:.06em;border-bottom:5px solid #1244ad}
.go:active{transform:translateY(2px)}
.fs{margin-top:14px;background:transparent;color:#9fb0d6;font-weight:800;font-size:11px;letter-spacing:.1em;padding:9px 16px;border-radius:10px;outline:1.5px solid #3a4770}
[hidden]{display:none!important}
.tl{width:100%;background:#1a2238;border-radius:12px;padding:8px 10px 10px;margin-top:9px;text-align:left}
.tl h3{margin:0 0 5px;font-size:11px;letter-spacing:.08em;display:flex;justify-content:space-between}
.tl h3 em{font-style:normal;color:#9fb0d6;font-weight:700;letter-spacing:0}
.tlr{display:flex;align-items:center;height:17px}
.tlr label{width:38px;font-size:8.5px;font-weight:800;color:#7f8cab;letter-spacing:.06em}
.tlr div{flex:1;height:15px;position:relative;background:#111829;border-radius:4px}
.tlr svg{position:absolute;top:2px;width:11px;height:11px;margin-left:-5px}
.axis{display:flex;justify-content:space-between;margin-left:38px;font-size:8px;color:#6b7896;margin-top:2px}
</style>
</head>
<body>
<div id="stage"><div id="phone"><div id="screen">
  <div id="view">
    <canvas id="c"></canvas>
    <div id="top">
      <div id="foe" class="card">
        <div class="row"><span class="nm" style="color:var(--red)">RIVAL</span><div class="hp"><i id="ehp" style="background:var(--red)"></i></div><span class="hpn" id="ehpn"></span></div>
        <div id="intel"><span class="tag">INTEL</span>
          <span class="it" id="iw"></span><span class="it" id="itank"></span><span class="it" id="irock"></span><span class="it" id="isniper"></span><span class="it" id="iapc"></span>
          <span id="iage">none yet</span></div>
      </div>
      <div id="clock" class="card"><span id="tm">3:00</span><small>TIME</small></div>
    </div>
    <div id="toasts"></div>
  </div>
  <div id="panel">
    <div id="me"><span class="nm">YOU</span><div class="hp"><i id="php" style="background:var(--blue)"></i></div><span class="hpn" id="phpn"></span></div>
    <div id="eco"><div id="purse"><span><i class="coin"></i><span id="coins">0</span></span><small id="inc">+5/s</small></div><button id="wk" class="mn"></button></div>
    <div id="grid"></div>
  </div>
  <div id="ov"></div>
</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ================= CONFIG ================= */
const CFG={startCoins:50,startWorkers:5,workerCost:50,workerTime:10,resCost:100,resTime:15,
  baseHp:1000,turretDmg:18,turretCd:.8,turretRange:7,matchTime:180,BZ:11,laneX:3.6};
const UNIT={
  inf:{name:'Infantry',cost:25,train:4,hp:60,dmg:6,cd:.5,range:3.0,speed:1.6},
  tank:{name:'Tank',res:100,cost:60,train:8,hp:240,dmg:30,cd:1.5,range:3.6,speed:1.2,splash:1.1},
  rock:{name:'Rocketeer',res:100,cost:60,train:8,hp:70,dmg:40,cd:2,range:4.2,speed:1.4},
  sniper:{name:'Sniper',res:150,cost:70,train:9,hp:55,dmg:45,cd:1.8,range:5.1,speed:1.3,baseMult:.5},
  apc:{name:'APC',res:125,cost:100,train:9,hp:200,dmg:8,cd:.6,range:3.0,speed:1.5,drops:3},
  scout:{name:'Scout',cost:30,hp:90,speed:4.5}
};
// MULT[attacker][target]
const MULT={inf:{inf:1,tank:.4,rock:1.75,sniper:1.2,apc:.5},tank:{inf:2,tank:1,rock:.5,sniper:2,apc:1},rock:{inf:.5,tank:2.5,rock:1,sniper:.5,apc:2.5},
  sniper:{inf:1.5,tank:.2,rock:1.6,sniper:1.3,apc:.2},apc:{inf:1,tank:.5,rock:1,sniper:1,apc:1}};
function Z(){return{inf:0,tank:0,rock:0,sniper:0,apc:0}}
const BEATS={inf:['rock'],tank:['inf','sniper'],rock:['tank','apc'],sniper:['inf','rock'],apc:[]};
const TYPES=['inf','tank','rock','sniper','apc'],TECHS=['tank','rock','sniper','apc'];
const TEAM=[{main:0x1f6dff,light:0x7db2ff,tracer:0x0090ff},{main:0xff2b3f,light:0xff8a94,tracer:0xff5a00}];
const TCOL={worker:'#ffc93c',inf:'#7ee081',tank:'#ff9f43',rock:'#c58bff',scout:'#5ad1ff',sniper:'#ff6fb5',apc:'#4fd8c4'};

/* ================= ICONS ================= */
const ICON={
 worker:'<path d="M4 9c4-5 12-5 16 0" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M12 6v15" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>',
 inf:'<circle cx="12" cy="7" r="4.2"/><path d="M5.5 21v-4.5a6.5 6.5 0 0 1 13 0V21z"/>',
 tank:'<rect x="2" y="13" width="19" height="7" rx="3.5"/><rect x="6" y="7.5" width="9" height="6" rx="1.5"/><rect x="14" y="9.2" width="9" height="2.4" rx="1"/>',
 rock:'<path d="M12 1.5c3.2 3 4.3 7.2 4.3 11.5H7.7c0-4.3 1.1-8.500 4.3-11.5z"/><path d="M7.7 12l-3.4 6h4.6zM16.3 12l3.4 6h-4.6z"/><rect x="10.3" y="14" width="3.4" height="7.500" rx="1"/>',
 scout:'<path d="M2 12c4.500-7.500 15.500-7.500 20 0c-4.500 7.500-15.500 7.500-20 0z" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="3.6"/>',
 sniper:'<circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 1.5v6M12 16.5v6M1.5 12h6M16.5 12h6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="2"/>',
 apc:'<path d="M1.5 8.5h14.5l6.5 4.5v4h-21z"/><circle cx="6" cy="18.500" r="2.600"/><circle cx="12" cy="18.500" r="2.600"/><circle cx="18" cy="18.500" r="2.600"/>',
 lock:'<rect x="5.500" y="10.500" width="13" height="10" rx="2.500"/><path d="M8.500 11V8a3.500 3.500 0 0 1 7 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/>'
};
const ico=(k,st='')=>`<svg viewBox="0 0 24 24" fill="currentColor" style="${st}">${ICON[k]}</svg>`;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a);

/* ================= AUDIO ================= */
let AC=null,NB=null,lastShot=0;
function audioInit(){ if(AC)return; try{AC=new (window.AudioContext||window.webkitAudioContext)();
  NB=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null}}
function tone(f,d,type,v,f2){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v,fc){const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='lowpass';f.frequency.value=fc;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d)}
function sfx(k){ if(!AC)return; const now=performance.now();
  switch(k){
   case 'shot': if(now-lastShot<55)return; lastShot=now; noise(.05,.05,3500); break;
   case 'boom': noise(.28,.22,900); tone(110,.2,'sine',.14,40); break;
   case 'big': noise(.7,.4,600); tone(80,.6,'sine',.3,28); break;
   case 'tap': tone(520,.06,'triangle',.1); break;
   case 'no': tone(150,.1,'square',.06); break;
   case 'deploy': tone(300,.14,'triangle',.13,720); break;
   case 'ready': tone(660,.09,'sine',.1); setTimeout(()=>AC&&tone(990,.12,'sine',.1),80); break;
   case 'intel': tone(880,.1,'sine',.12); setTimeout(()=>AC&&tone(1320,.2,'sine',.12),100); break;
   case 'alarm': tone(440,.12,'square',.07); setTimeout(()=>AC&&tone(330,.16,'square',.07),130); break;
   case 'snipe': tone(1500,.14,'sawtooth',.07,180); noise(.12,.12,2500); break;
   case 'launch': noise(.2,.08,1800); break;
  }}

/* ================= THREE SETUP ================= */
const T=THREE, canvas=$('c'), view=$('view');
const renderer=new T.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2.5));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene(); scene.background=new T.Color(0xd5dce8); scene.fog=new T.Fog(0xd5dce8,50,90);
const camera=new T.PerspectiveCamera(42,.7,1,200);
const CAM={x:0,y:33,z:14.5,lx:0,ly:0,lz:-1.9};
scene.add(new T.HemisphereLight(0xffffff,0xb4bfd6,.6));
const sun=new T.DirectionalLight(0xffffff,.5); sun.position.set(9,22,7); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-16,right:16,top:18,bottom:-18,near:1,far:60}); sun.shadow.radius=3; sun.shadow.bias=-.0004;
scene.add(sun);

const geoCache={};
function geo(key,f){return geoCache[key]||(geoCache[key]=f())}
const GEO={box:new T.BoxGeometry(1,1,1),sph:new T.SphereGeometry(1,24,16),ring:new T.RingGeometry(.78,1,40),disc:new T.CircleGeometry(1,40)};
const sm=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.42,metalness:.08},o||{}));
const MAT={dark:sm(0x252c3f),white:sm(0xffffff),skin:sm(0xffd3ad),gold:sm(0xffc400,{emissive:0x664400}),
  team:TEAM.map(t=>({main:sm(t.main),light:sm(t.light)}))};
const bmC={}; const bm=c=>bmC[c]||(bmC[c]=new T.MeshBasicMaterial({color:c}));
const tm=(c,o)=>new T.MeshBasicMaterial({color:c,transparent:true,opacity:o==null?1:o,depthWrite:false,side:T.DoubleSide});
function add(p,g,m,x,y,z,sx,sy,sz){const o=new T.Mesh(g,m);o.position.set(x,y,z);if(sx!=null)o.scale.set(sx,sy,sz);o.castShadow=true;p.add(o);return o}

    box(g,tm_.main,.95,.36,1.55,0,.4,0); box(g,MAT.white,.95,.07,.18,0,.6,-.55);
    cyl(g,tm_.light,.4,.46,.3,0,.72,-.08);

/* ================= FX ================= */
const fx=[]; let shake=0;
function addFx(mesh,life,fn,own){scene.add(mesh);fx.push({mesh,t:0,life,fn,own})}
function pop(k,peak){return k<peak?k/peak:1-(k-peak)/(1-peak)}
function blob(color,x,y,z,size,life,peak){const m=new T.Mesh(GEO.sph,bm(color));m.position.set(x,y,z);m.scale.setScalar(.01);
  addFx(m,life,(o,k)=>o.scale.setScalar(Math.max(.01,size*Math.sqrt(pop(k,peak||.3)))))}
function ring(color,x,z,size,life,delay){const m=new T.Mesh(GEO.ring,tm(color));m.rotation.x=-Math.PI/2;m.position.set(x,.06,z);m.scale.setScalar(.01);
  addFx(m,life+(delay||0),(o,k)=>{const d=(delay||0)/(life+(delay||0));const kk=Math.max(0,(k-d)/(1-d));const e=1-Math.pow(1-kk,3);o.scale.setScalar(Math.max(.01,size*e));o.material.opacity=kk<=0?0:1-kk},true)}
function sparks(color,x,y,z,n,spd,size){for(let i=0;i<n;i++){const m=new T.Mesh(GEO.box,bm(color));m.position.set(x,y,z);
  const a=Math.random()*6.28,v=rnd(.4,1)*spd;let vx=Math.cos(a)*v,vz=Math.sin(a)*v,vy=rnd(2,5.5);const s=rnd(.6,1.2)*size;
  addFx(m,rnd(.35,.6),(o,k,dt)=>{vy-=14*dt;o.position.x+=vx*dt;o.position.y=Math.max(.05,o.position.y+vy*dt);o.position.z+=vz*dt;o.rotation.x+=dt*9;o.rotation.y+=dt*7;o.scale.setScalar(s*(1-k))})}}
function smoke(x,y,z,n,size){for(let i=0;i<n;i++){const m=new T.Mesh(GEO.sph,bm(i%2?0x59627a:0x8690a8));m.position.set(x+rnd(-.3,.3)*size,y,z+rnd(-.3,.3)*size);
  const vy=rnd(.8,1.8),s=rnd(.25,.45)*size,vx=rnd(-.4,.4);m.scale.setScalar(.01);
  addFx(m,rnd(.5,.9),(o,k,dt)=>{o.position.y+=vy*dt;o.position.x+=vx*dt;o.scale.setScalar(Math.max(.01,s*pop(k,.25)))})}}
function explosion(x,y,z,s,team){
  blob(0xff5a00,x,y,z,s,.34); blob(0xffd21f,x,y+.05,z,s*.68,.26); blob(0xffffff,x,y+.1,z,s*.4,.14,.4);
  ring(team!=null?TEAM[team].main:0xff7a00,x,z,s*1.9,.42); sparks(0xffb300,x,y,z,Math.round(4+s*4),3.5+s*2,.14); smoke(x,y+.2,z,Math.round(2+s*2),s);
  shake=Math.max(shake,.06*s);
}
function tracer(x1,y1,z1,x2,y2,z2,color,thick){const W=thick?.15:.09;
  const dx=x2-x1,dy=y2-y1,dz=z2-z1,l=Math.hypot(dx,dy,dz);const m=new T.Mesh(GEO.box,bm(color));
  m.position.set(x1+dx/2,y1+dy/2,z1+dz/2);m.lookAt(x2,y2,z2);m.scale.set(W,W,l);
  addFx(m,thick?.26:.09,(o,k)=>{o.scale.x=o.scale.y=W*(1-k)});
  if(thick){ring(color,x2,z2,1.1,.3);blob(0xff2bd0,x2,y2,z2,.42,.2,.35)}
  blob(0xffe95a,x1,y1,z1,.26,.09,.4); blob(0xffffff,x2,y2,z2,.2,.12,.4); sparks(color,x2,y2,z2,1,2,.09);
}
function debris(x,z,team,n,size){for(let i=0;i<n;i++){const m=new T.Mesh(GEO.box,i%3?MAT.team[team].main:MAT.dark);m.castShadow=true;m.position.set(x,.5,z);
  const a=Math.random()*6.28,v=rnd(1,3.5);let vx=Math.cos(a)*v,vz=Math.sin(a)*v,vy=rnd(3,7);const s=rnd(.14,.3)*size;
  addFx(m,rnd(.8,1.2),(o,k,dt)=>{vy-=18*dt;o.position.x+=vx*dt;o.position.z+=vz*dt;o.position.y+=vy*dt;if(o.position.y<s/2){o.position.y=s/2;vy*=-.4;vx*=.6;vz*=.6}
    o.rotation.x+=dt*8;o.rotation.z+=dt*6;o.scale.setScalar(s*(k>.7?(1-k)/.3:1))})}}
function deployFx(x,z,team){
  ring(TEAM[team].main,x,z,1.5,.4); ring(0xffffff,x,z,1,.3);

function revealFx(team){const z=team?-CFG.BZ:CFG.BZ;for(let i=0;i<3;i++)ring(0xffb800,0,z,5+i*1.5,.7,i*.14);blob(0xffd21f,0,3,z,1.4,.4)}

/* ---------- actions (identical rules for player and bot) ---------- */
function buyWorker(s){if(s.coins<CFG.workerCost)return false;s.coins-=CFG.workerCost;s.workerQ++;logE(s,'worker','worker');return true}
function research(s,k){if(s.tech[k]!==0||s.coins<UNIT[k].res)return false;s.coins-=UNIT[k].res;s.tech[k]=.5;s.resProg[k]=0;logE(s,'res',k);return true}
function train(s,k){if(s.tech[k]!==1||s.coins<UNIT[k].cost)return false;s.coins-=UNIT[k].cost;s.q[k]++;logE(s,'train',k);return true}
function deploy(s,k){if(s.reserve[k]<1)return false;s.reserve[k]--;spawnUnit(s.team,k);logE(s,'deploy',k);if(isP(s))sfx('deploy');return true}
function deployAll(s,k){const pending=s.deployQ.filter(x=>x===k).length;for(let i=pending;i<s.reserve[k];i++)s.deployQ.push(k)}
function sendScout(s){if(s.coins<UNIT.scout.cost)return false;s.coins-=UNIT.scout.cost;spawnUnit(s.team,'scout');logE(s,'scout','scout');if(isP(s))sfx('launch');return true}

function tickSide(s,dt){
  const inc=s.workers*dt;s.coins+=inc;s.earned+=inc;
  if(s.workerQ>0){s.workerProg+=dt;if(s.workerProg>=CFG.workerTime){s.workerProg=0;s.workerQ--;s.workers++;if(isP(s)){sfx('ready')}}}
  for(const k of TECHS)if(s.tech[k]===.5){s.resProg[k]+=dt;if(s.resProg[k]>=CFG.resTime){s.tech[k]=1;if(isP(s)){floatMsg(UNIT[k].name+' unlocked!',k);sfx('ready')}}}
  for(const k of TYPES)if(s.q[k]>0){s.prog[k]+=dt;if(s.prog[k]>=UNIT[k].train){s.prog[k]=0;s.q[k]--;s.reserve[k]++;s.made++;if(isP(s))sfx('tap')}}
  if(s.deployQ.length){s.deployCd-=dt;if(s.deployCd<=0){s.deployCd=.13;deploy(s,s.deployQ.shift())}}
  // turret
  s.turretCd-=dt;const bz=s.team?-CFG.BZ:CFG.BZ;let best=null,bd=CFG.turretRange;
  for(const u of units){if(!u.alive||u.team===s.team||u.type==='scout')continue;const d=Math.hypot(u.x,u.z-bz);if(d<bd){bd=d;best=u}}
  const B=bases[s.team];
  if(best){const a=Math.atan2(best.x,best.z-bz)-B.g.rotation.y;B.tur.rotation.y=a;
    if(s.turretCd<=0){s.turretCd=CFG.turretCd;const sx=Math.sin(a+B.g.rotation.y)*1.6,sz=Math.cos(a+B.g.rotation.y)*1.6;
      fireShot({kind:'bolt',team:s.team,at:'turret',dmg:CFG.turretDmg,x:sx,y:2.7,z:bz+sz,tg:best,speed:24});blob(0xffffff,sx,2.7,bz+sz,.5,.1,.4);sfx('shot')}}
}

/* ---------- units ---------- */
function spawnUnit(team,type,px,pz){
  const d=UNIT[type];
  const u={id:uid++,team,type,x:((S[team].slot=(S[team].slot||0)+1)*.618%1*6.4-3.2),z:(team?-1:1)*(CFG.BZ-2.7+rnd(-.5,.3)),hp:d.hp,max:d.hp,cd:rnd(0,.3),rt:0,alive:true,tg:null,chase:null,spawn:0,
    r:(type==='tank'||type==='apc')?.95:.5,base:type==='tank'?1.35:type==='apc'?1.3:type==='scout'?1.35:1.65,ang:team?0:Math.PI,punch:0};
  u.mesh=buildUnit(team,type);u.mesh.position.set(u.x,0,u.z);u.mesh.rotation.y=u.ang;u.mesh.scale.setScalar(.01);scene.add(u.mesh);
  u.bar=makeBar(team);u.bar.visible=false;scene.add(u.bar);
  if(px!=null){u.x=px;u.z=pz;u.mesh.position.set(px,0,pz)}
  units.push(u);deployFx(u.x,u.z,team);return u;
}
const mult=(at,tt)=>(at==='turret'||tt==='scout')?1:MULT[at][tt];
function pickTarget(u,d){
  let best=null,bs=-1e9,ch=null,cd=7.5;
  for(const o of units){if(!o.alive||o.team===u.team)continue;const dist=Math.hypot(o.x-u.x,o.z-u.z);
    if(dist<=d.range+o.r*.5){const sc=mult(u.type,o.type)*100-dist-(o.type==='scout'?60:0);if(sc>bs){bs=sc;best=o}}
    else if(o.type!=='scout'&&dist<cd){cd=dist;ch=o}}
  u.tg=best;u.chase=ch;
}
function face(u,ax,az,dt){const a=Math.atan2(ax-u.x,az-u.z);let df=a-u.ang;while(df>Math.PI)df-=6.2832;while(df<-Math.PI)df+=6.2832;u.ang+=df*Math.min(1,dt*12)}
function updateUnit(u,dt){
  const d=UNIT[u.type],dir=u.team?1:-1,ebz=u.team?CFG.BZ:-CFG.BZ;
  if(u.spawn<1)u.spawn=Math.min(1,u.spawn+dt*3.5);
  if(u.punch>0)u.punch-=dt;
  if(u.type==='scout'){u.z+=dir*d.speed*dt;if(Math.abs(u.z-ebz)<3.4)scoutArrive(u);return}
  u.cd-=dt;u.rt-=dt;
  if(u.lock)u.tg=null;else if(u.rt<=0||(u.tg&&!u.tg.alive)){u.rt=.2;pickTarget(u,d)}
  let tgt=u.lock?'base':u.tg;
  if(!tgt){const fz=ebz-dir*1.8;if(Math.abs(u.z-fz)<=d.range){tgt='base';u.lock=true}}
  if(tgt){
    if(tgt==='base')face(u,u.x*.4,ebz,dt);else face(u,tgt.x,tgt.z,dt);
    if(u.cd<=0){u.cd=d.cd;fire(u,tgt,d,ebz)}
  }else{
    let mx=0,mz=dir;
    if(u.chase&&u.chase.alive){const dx=u.chase.x-u.x,dz=u.chase.z-u.z,l=Math.hypot(dx,dz)||1;mx=dx/l;mz=dz/l}
    u.x+=mx*d.speed*dt;u.z+=mz*d.speed*dt;face(u,u.x+mx,u.z+mz,dt);
  }
  for(const o of units){if(o===u||o.team!==u.team||!o.alive||o.type==='scout')continue;let dx=u.x-o.x,dz=u.z-o.z;const rr=u.r+o.r,l=Math.hypot(dx,dz);
    if(l<rr){if(l<.01){dx=u.id>o.id?1:-1;dz=0}else{dx/=l;dz/=l}const push=(rr-l)*4*dt;u.x+=dx*push*1.4;u.z+=dz*push*.6}}
  u.x=clamp(u.x,-CFG.laneX,CFG.laneX);
}
function fire(u,tgt,d,ebz){
  const fx_=u.x+Math.sin(u.ang)*.7,fz=u.z+Math.cos(u.ang)*.7,fy=u.type==='tank'?.9:.85;
  u.punch=.1;
  if(u.type==='inf'||u.type==='sniper'||u.type==='apc'){
    const sn=u.type==='sniper',col=sn?(u.team?0x8a0018:0x0a2a8a):TEAM[u.team].tracer;
    if(tgt==='base'){tracer(fx_,fy,fz,u.x*.4+rnd(-.8,.8),rnd(.8,2),ebz,col,sn);damageBase(1-u.team,d.dmg*(d.baseMult||1))}
    else{tracer(fx_,fy,fz,tgt.x,.6,tgt.z,col,sn);damage(tgt,d.dmg*mult(u.type,tgt.type))}
    sfx(sn?'snipe':'shot');
  }else{
    const o={kind:u.type==='tank'?'shell':'rocket',team:u.team,at:u.type,dmg:d.dmg,x:fx_,y:fy,z:fz,speed:u.type==='tank'?20:11,splash:d.splash||0};
    if(tgt==='base'){o.base=true;o.tx=u.x*.4+rnd(-1,1);o.ty=rnd(.8,2.2);o.tz=ebz}else o.tg=tgt;
    fireShot(o);blob(0xffd21f,fx_,fy,fz,u.type==='tank'?.55:.4,.12,.4);sfx(u.type==='tank'?'boom':'launch');
  }
}
function fireShot(o){
  let m;
  if(o.kind==='shell'){m=new T.Mesh(GEO.sph,bm(0x1c2233));m.scale.setScalar(.17)}
  else if(o.kind==='rocket'){m=new T.Group();const b=new T.Mesh(geo('rk',()=>new T.CylinderGeometry(.09,.09,.6,8)),bm(0x1c2233));b.rotation.x=Math.PI/2;m.add(b);
    const t=new T.Mesh(geo('rt',()=>new T.CylinderGeometry(0,.11,.25,8)),bm(0xffb300));t.rotation.x=Math.PI/2;t.position.z=.42;m.add(t)}
  else{m=new T.Mesh(GEO.sph,bm(TEAM[o.team].main));m.scale.set(.2,.2,.5)}
  m.position.set(o.x,o.y,o.z);scene.add(m);o.mesh=m;o.trail=0;
  if(o.tg){o.tx=o.tg.x;o.ty=.6;o.tz=o.tg.z}
  shots.push(o);
}
function updateShot(o,dt){
  if(o.tg&&o.tg.alive){o.tx=o.tg.x;o.tz=o.tg.z}
  const dx=o.tx-o.x,dy=o.ty-o.y,dz=o.tz-o.z,l=Math.hypot(dx,dy,dz),st=o.speed*dt;
  if(l<=st){ // impact
    scene.remove(o.mesh);o.done=true;
    const big=o.kind==='rocket'?1.25:o.kind==='shell'?.95:.6;
    explosion(o.tx,o.ty,o.tz,big,o.kind==='bolt'?o.team:null);sfx('boom');
    if(o.base)damageBase(1-o.team,o.dmg);
    else{
      if(o.tg&&o.tg.alive)damage(o.tg,o.dmg*mult(o.at,o.tg.type));
      if(o.splash)for(const u of units){if(!u.alive||u.team===o.team||u===o.tg||u.type==='scout')continue;
        if(Math.hypot(u.x-o.tx,u.z-o.tz)<o.splash)damage(u,o.dmg*.5*mult(o.at,u.type))}
    }
    return;
  }
  o.x+=dx/l*st;o.y+=dy/l*st;o.z+=dz/l*st;o.mesh.position.set(o.x,o.y,o.z);o.mesh.lookAt(o.tx,o.ty,o.tz);
  if(o.kind==='rocket'){o.trail-=dt;if(o.trail<=0){o.trail=.035;const m=new T.Mesh(GEO.sph,bm(Math.random()<.4?0xff8a00:0x7a849c));m.position.set(o.x,o.y,o.z);const s=rnd(.12,.2);
    addFx(m,.35,(p,k)=>p.scale.setScalar(s*(1-k)+.01))}}
}
function damage(u,amt){
  if(!u.alive)return;u.hp-=amt;u.punch=.1;
  if(u.hp<=0){u.alive=false;scene.remove(u.mesh);scene.remove(u.bar);
    const big=u.type==='tank'||u.type==='apc';explosion(u.x,.5,u.z,big?1.5:.75,null);debris(u.x,u.z,u.team,big?10:5,big?1.4:1);sfx('boom');
    if(u.type==='apc')for(let i=0;i<UNIT.apc.drops;i++)spawnUnit(u.team,'inf',clamp(u.x+(i-1)*.8,-CFG.laneX,CFG.laneX),u.z+rnd(-.3,.3));
    if(u.type==='scout'&&u.team===0){toast('Your scout was destroyed','warn')}
    if(u.type==='scout'&&u.team===1){toast('Enemy scout shot down','good')}}
}
function damageBase(team,amt){
  if(state!=='play')return;const s=S[team];s.hp=Math.max(0,s.hp-amt);shake=Math.max(shake,.05);
  const me=S[1-team];me.intel={t:time,workers:s.workers,tank:s.tech.tank,rock:s.tech.rock,sniper:s.tech.sniper,apc:s.tech.apc};

/* ================= BOT ================= */
const ARCH={
  rusher:{name:'Rusher',desc:'No economy, early infantry waves.',w:{inf:1,tank:.5,rock:.2,sniper:.1,apc:.3},scout:[75,60]},
  greedy:{name:'Boomer',desc:'Heavy economy first, big army late.',w:{inf:.5,tank:1,rock:.8,sniper:.4,apc:.5},scout:[45,45]},
  tech:{name:'Fast Tech',desc:'Straight to advanced units.',w:{inf:.25,tank:.6,rock:.6,sniper:.3,apc:.3},scout:[40,55]},
  adaptive:{name:'Adaptive',desc:'Probes your base early, then counters what it sees.',w:{inf:.6,tank:.6,rock:.5,sniper:.3,apc:.5},scout:[20,35]}
};
function botInit(force){
  const keys=Object.keys(ARCH),k=force||keys[Math.random()*keys.length|0],r1=k==='tech'?TECHS[Math.random()*4|0]:(Math.random()<.5?'tank':'rock');
  bot={k,r1,r2:r1==='tank'?'rock':'tank',mem:Z(),nextScout:ARCH[k].scout[0]+rnd(-5,5),think:0,waves:0};
  if(k==='tech')bot.w=Object.assign({},ARCH.tech.w,{[r1]:1.3}); else bot.w=ARCH[k].w;
}
function botThink(){
  const b=S[1],t=time,A=bot,I=b.intel;
  const seen=Z(),field=Z();let threat=0,near=0,mine=0;
  for(const u of units){if(!u.alive||u.type==='scout')continue;const c=UNIT[u.type].cost;
    if(u.team===0){seen[u.type]++;threat+=c;if(u.z<3)near+=c}else{field[u.type]++;mine+=c}}
  for(const k of TYPES)A.mem[k]=Math.max(A.mem[k]*.99,seen[k]);
  let resVal=0;for(const k of TYPES)resVal+=b.reserve[k]*UNIT[k].cost;
  // composition weights from what it has legitimately seen
  const w=Object.assign({},A.w);
  w.tank+=.9*A.mem.inf+1.0*A.mem.sniper;w.rock+=1.3*A.mem.tank+1.0*A.mem.apc;w.inf+=1.0*A.mem.rock;w.sniper+=.5*A.mem.inf+.7*A.mem.rock;
  if(I){if(I.tank)w.rock+=1.2;if(I.rock)w.inf+=1;if(I.sniper)w.tank+=1;if(I.apc)w.rock+=.6;if(!I.tank&&!I.rock)w.tank+=.8}
  const underThreat=near>40||threat>mine+resVal+60;
  // research plan
  let plan=[];
  if(A.k==='rusher')plan=[[70,'tank'],[125,'rock']];
  else if(A.k==='greedy')plan=[[38,A.r1],[90,A.r2]];
  else if(A.k==='tech')plan=[[0,A.r1],[85,A.r2]];
  else{const first=I&&I.tank?'rock':(I&&I.rock?'tank':A.r1);if(t>30||I)plan=[[0,(b.tech.tank||b.tech.rock)?(b.tech.tank?'tank':'rock'):first],[95,'tank'],[95,'rock']]}
  let wantRes=null;
  for(const[pt,ty]of plan)if(t>=pt&&!b.tech[ty]){wantRes=ty;break}
  if(!wantRes){if(A.mem.tank>=1.5&&!b.tech.rock)wantRes='rock';else if(A.mem.inf>=5&&!b.tech.tank)wantRes='tank';else if(I&&I.tank&&!b.tech.rock&&t>50)wantRes='rock';else if(I&&I.sniper&&!b.tech.tank&&t>50)wantRes='tank';else if(A.mem.inf+A.mem.rock>=6&&!b.tech.sniper&&b.workers>=8)wantRes='sniper'}
  const wTarget=A.k==='rusher'?(t<70?5:8):A.k==='greedy'?13:A.k==='tech'?(t<55?6:9):9;
  let saving=false,noUnits=(A.k==='greedy'&&t<42&&!underThreat);
  if(t<CFG.matchTime-55&&b.workers+b.workerQ<wTarget&&b.workerQ<1&&!underThreat)buyWorker(b);
  if(wantRes&&t<CFG.matchTime-35){if(!research(b,wantRes)&&!underThreat)saving=true}
  if(!saving&&!noUnits&&t<CFG.matchTime-14){
    let best=null,bs=-1;
    for(const k of TYPES){if(b.tech[k]!==1||b.q[k]>=2)continue;const have=(b.reserve[k]+b.q[k]+field[k])*UNIT[k].cost/25;const sc=w[k]/(have+1);if(sc>bs){bs=sc;best=k}}
    if(best)train(b,best);
  }
  // defend: answer what is actually walking at the base
  if(near>40){let need=near*1.25-mine,n=0;
    while(need>0&&n<3){let bk=null,bsc=-1;for(const k of TYPES){if(b.reserve[k]-b.deployQ.filter(x=>x===k).length<1)continue;
        let sc=.1;for(const j of TYPES)sc+=seen[j]*MULT[k][j];if(sc>bsc){bsc=sc;bk=k}}
      if(!bk)break;b.deployQ.push(bk);need-=UNIT[bk].cost;n++}}
  // attack
  let thr;
  if(A.k==='rusher')thr=A.waves?125:150;else if(A.k==='greedy')thr=t>125?200:420;else if(A.k==='tech')thr=230;
  else thr=!I?75:(I.workers>=8+t/25)?190:300;
  if(resVal>=thr||(t>CFG.matchTime-30&&resVal>0)){A.waves++;for(const k of TYPES)deployAll(b,k)}
}

function simStep(dt){
  if(state==='play'){
    time+=dt;
    tickSide(S[0],dt);tickSide(S[1],dt);
    bot.think-=dt;if(bot.think<=0){bot.think=.4;botThink()}
    for(const u of units)if(u.alive)updateUnit(u,dt);
    for(const o of shots)if(!o.done)updateShot(o,dt);
    if(units.some(u=>!u.alive))units=units.filter(u=>u.alive);
    if(shots.some(o=>o.done))shots=shots.filter(o=>!o.done);
    if(time>=CFG.matchTime&&state==='play')endGame();
  }
  for(let j=fx.length-1;j>=0;j--){const f=fx[j];f.t+=dt;if(f.t>=f.life){scene.remove(f.mesh);if(f.own)f.mesh.material.dispose();fx.splice(j,1)}else f.fn(f.mesh,f.t/f.life,dt)}
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let rdt=Math.min(.05,(now-last)/1000);last=now;
  const steps=state==='play'?Math.max(1,Math.round(speed)):1;
  for(let i=0;i<steps;i++)simStep(rdt*(speed<1?speed:1));
  // sync meshes
  for(const u of units){const s=u.base*(u.spawn<1?(u.spawn*1.25>1?1+(1-u.spawn)*.6:u.spawn*1.25):1)*(u.punch>0?1.08:1);
    u.mesh.scale.setScalar(Math.max(.01,s));u.mesh.position.set(u.x,0,u.z);u.mesh.rotation.y=u.ang;
    if(u.hp<u.max){u.bar.visible=true;u.bar.position.set(u.x,u.type==='tank'?1.9:1.75,u.z);u.bar.quaternion.copy(camera.quaternion);const r=Math.max(0,u.hp/u.max);u.bar.f.scale.x=.94*r;u.bar.f.position.x=-.47*(1-r)}}
  shake*=Math.pow(.002,rdt);
  camera.position.set(CAM.x+(Math.random()-.5)*shake*2,CAM.y+(Math.random()-.5)*shake,CAM.z+(Math.random()-.5)*shake*2);
  camera.lookAt(CAM.lx,CAM.ly,CAM.lz);

}
